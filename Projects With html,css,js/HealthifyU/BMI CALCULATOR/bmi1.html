<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthifyU - BMI Calculator</title>
    <link rel="stylesheet" href="bmi1.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
<link rel="shortcut icon"  href="/IMAGES/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100">
    <div id="main" data-scroll-container>
        <!-- Navigation Bar -->
        <nav class="bg-white shadow-lg sticky top-0 z-50" data-scroll-section>
            <div class="max-w-6xl mx-auto px-4">
                <div class="flex justify-between">
                    <div class="flex space-x-7">
                        <div>
                            <a href="/index.html" class="flex items-center py-4 px-2">
                                <span class="font-semibold text-green-600 text-2xl">HealthifyU</span>
                            </a>
                        </div>
                    </div>
                    <div class="hidden md:flex items-center space-x-1">
                        <a href="/index.html" class="py-4 px-2 text-gray-500 hover:text-green-600 transition duration-300">Home</a>
                        <a href="/bmi1.html" class="py-4 px-2 text-green-600 border-b-4 border-green-600 font-semibold">BMI Calculator</a>
                        <a href="/MENTAL HEALTH/Mental.html" class="py-4 px-2 text-gray-500 hover:text-green-600 transition duration-300">Mental Health</a>
                        <a href="/Meal Planner/meal.html" class="py-4 px-2 text-gray-500 hover:text-green-600 transition duration-300">Meal Planner</a>
                        <a href="/AI assistent/ai.html" class="py-4 px-2 text-gray-500 hover:text-green-600 transition duration-300">AI Assistant</a>
                        <a href="#" class="py-4 px-2 text-gray-500 hover:text-green-600 transition duration-300">Emergency</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="flex justify-center items-center min-h-[80vh] px-4 py-8" data-scroll-section>
            <div class="container bg-white rounded-2xl shadow-xl p-8 max-w-md w-full" data-scroll data-scroll-speed="0.5">
                <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">BMI Calculator</h1>
                <form id="bmiForm">
                    <div class="mb-4">
                        <label for="height" class="block text-gray-700 mb-2">Height (cm):</label>
                        <input type="number" id="height" placeholder="Enter your height" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-6">
                        <label for="weight" class="block text-gray-700 mb-2">Weight (kg):</label>
                        <input type="number" id="weight" placeholder="Enter your weight" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 transform hover:-translate-y-1 shadow-md">
                        Calculate BMI
                    </button>
                    <div id="results" class="mt-6 text-center text-xl font-semibold p-4 rounded-lg hidden"></div>
                    <div id="weight-guide" class="mt-8">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4 text-center">BMI Weight Guide</h3>
                        <div class="guide-item underweight mb-3 flex justify-between items-center p-3 rounded-lg">
                            <span>Under Weight</span>
                            <span>BMI ≤ 18.6</span>
                        </div>
                        <div class="guide-item normal mb-3 flex justify-between items-center p-3 rounded-lg">
                            <span>Normal Range</span>
                            <span>18.6 < BMI ≤ 24.9</span>
                        </div>
                        <div class="guide-item overweight flex justify-between items-center p-3 rounded-lg">
                            <span>Overweight</span>
                            <span>BMI > 24.9</span>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.js"></script>
    <script src="bmi1.js"></script>
</body>
</html>
