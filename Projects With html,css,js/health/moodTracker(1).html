<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthBuddy+ – Enhanced Mood Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', sans-serif;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .dark .glass-card {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .mood-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .animate-bounce-slow {
      animation: bounce 2s infinite;
    }
    
    .animate-pulse-slow {
      animation: pulse 3s infinite;
    }
    
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    .mood-button {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateY(0);
    }
    
    .mood-button:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .entry-card {
      transition: all 0.3s ease;
      transform: translateX(0);
    }
    
    .entry-card:hover {
      transform: translateX(8px);
    }
    
    .stats-card {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    
    .insights-card {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    
    .streak-card {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }
    
    .notification {
      animation: slideIn 0.5s ease-out;
    }
    
    @keyframes slideIn {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .mood-terrible { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
    .mood-bad { background: linear-gradient(135deg, #ffa502, #ff6348); }
    .mood-okay { background: linear-gradient(135deg, #f1c40f, #f39c12); }
    .mood-good { background: linear-gradient(135deg, #55a3ff, #3742fa); }
    .mood-excellent { background: linear-gradient(135deg, #00d2d3, #54a0ff); }
    
    .ripple {
      position: relative;
      overflow: hidden;
    }
    
    .ripple::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .ripple:active::before {
      width: 300px;
      height: 300px;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-cyan-50 dark:from-gray-900 dark:via-gray-800 dark:to-blue-900 min-h-screen transition-all duration-500">
  <!-- Floating Background Elements -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="floating absolute top-20 left-10 w-20 h-20 bg-gradient-to-r from-pink-300 to-yellow-300 rounded-full opacity-20"></div>
    <div class="floating absolute top-40 right-20 w-16 h-16 bg-gradient-to-r from-blue-300 to-purple-300 rounded-full opacity-20" style="animation-delay: -2s;"></div>
    <div class="floating absolute bottom-40 left-20 w-24 h-24 bg-gradient-to-r from-green-300 to-blue-300 rounded-full opacity-20" style="animation-delay: -4s;"></div>
  </div>

  <!-- Notification Container -->
  <div id="notifications" class="fixed top-4 right-4 z-50 space-y-2"></div>

  <div class="relative z-10 min-h-screen p-4 sm:p-6">
    <div class="max-w-6xl mx-auto">
      <!-- Header -->
      <div class="mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="text-center sm:text-left">
          <h1 class="text-4xl sm:text-5xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
            🧠 Mood Tracker
          </h1>
          <p class="text-gray-600 dark:text-gray-300 mt-2">Track your emotional journey</p>
        </div>
        <div class="flex gap-3">
          <button onclick="exportData()" class="glass-card px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/20 transition-all">
            📊 Export Data
          </button>
          <button onclick="toggleTheme()" class="glass-card px-4 py-2 rounded-xl text-sm font-medium hover:bg-white/20 transition-all">
            🌓 Toggle Theme
          </button>
        </div>
      </div>

      <!-- Quick Stats Row -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="stats-card text-white rounded-2xl p-6 text-center">
          <div class="text-3xl font-bold" id="totalEntries">0</div>
          <div class="text-sm opacity-90">Total Entries</div>
        </div>
        <div class="streak-card text-white rounded-2xl p-6 text-center">
          <div class="text-3xl font-bold" id="entryStreak">0</div>
          <div class="text-sm opacity-90">Day Streak</div>
        </div>
        <div class="insights-card text-white rounded-2xl p-6 text-center">
          <div class="text-3xl font-bold" id="avgMood">N/A</div>
          <div class="text-sm opacity-90">Avg Mood</div>
        </div>
      </div>

      <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
        <!-- Left Column -->
        <div class="xl:col-span-2 space-y-8">
          <!-- Mood Input -->
          <div class="glass-card rounded-3xl p-6 sm:p-8">
            <h2 class="text-2xl font-semibold mb-6 text-center">How are you feeling today?</h2>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-4 mb-6">
              <button class="mood-button ripple mood-terrible text-white px-4 py-6 rounded-2xl font-medium text-center flex flex-col items-center gap-2" onclick="selectMood('terrible', this)">
                <span class="text-3xl">😰</span>
                <span class="text-sm">Terrible</span>
              </button>
              <button class="mood-button ripple mood-bad text-white px-4 py-6 rounded-2xl font-medium text-center flex flex-col items-center gap-2" onclick="selectMood('bad', this)">
                <span class="text-3xl">😔</span>
                <span class="text-sm">Bad</span>
              </button>
              <button class="mood-button ripple mood-okay text-white px-4 py-6 rounded-2xl font-medium text-center flex flex-col items-center gap-2" onclick="selectMood('okay', this)">
                <span class="text-3xl">😐</span>
                <span class="text-sm">Okay</span>
              </button>
              <button class="mood-button ripple mood-good text-white px-4 py-6 rounded-2xl font-medium text-center flex flex-col items-center gap-2" onclick="selectMood('good', this)">
                <span class="text-3xl">😊</span>
                <span class="text-sm">Good</span>
              </button>
              <button class="mood-button ripple mood-excellent text-white px-4 py-6 rounded-2xl font-medium text-center flex flex-col items-center gap-2" onclick="selectMood('excellent', this)">
                <span class="text-3xl">😍</span>
                <span class="text-sm">Excellent</span>
              </button>
            </div>

            <!-- Activity Tags -->
            <div class="mb-6">
              <label class="block text-sm font-medium mb-3">What influenced your mood? (Optional)</label>
              <div class="flex flex-wrap gap-2" id="activityTags">
                <button class="activity-tag px-3 py-1 text-sm rounded-full border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 transition-colors" onclick="toggleTag(this, 'work')">💼 Work</button>
                <button class="activity-tag px-3 py-1 text-sm rounded-full border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 transition-colors" onclick="toggleTag(this, 'exercise')">🏃 Exercise</button>
                <button class="activity-tag px-3 py-1 text-sm rounded-full border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 transition-colors" onclick="toggleTag(this, 'social')">👥 Social</button>
                <button class="activity-tag px-3 py-1 text-sm rounded-full border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 transition-colors" onclick="toggleTag(this, 'family')">👨‍👩‍👧 Family</button>
                <button class="activity-tag px-3 py-1 text-sm rounded-full border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 transition-colors" onclick="toggleTag(this, 'sleep')">😴 Sleep</button>
                <button class="activity-tag px-3 py-1 text-sm rounded-full border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 transition-colors" onclick="toggleTag(this, 'weather')">🌤️ Weather</button>
                <button class="activity-tag px-3 py-1 text-sm rounded-full border-2 border-gray-300 dark:border-gray-600 hover:border-blue-500 transition-colors" onclick="toggleTag(this, 'health')">🏥 Health</button>
              </div>
            </div>

            <div class="relative">
              <textarea id="moodNote" class="w-full p-4 border-2 border-gray-200 dark:border-gray-600 rounded-2xl dark:bg-gray-700/50 backdrop-blur-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all resize-none" rows="4" placeholder="Share more about your day... What made you feel this way?" maxlength="500"></textarea>
              <div class="absolute bottom-3 right-3 text-sm text-gray-400 bg-white/80 dark:bg-gray-800/80 px-2 py-1 rounded-lg" id="charCount">0/500</div>
            </div>
            
            <div class="mt-6 flex justify-between items-center">
              <button onclick="clearForm()" class="px-6 py-2 text-gray-600 dark:text-gray-300 hover:text-red-500 transition-colors">Clear</button>
              <button onclick="saveMoodEntry()" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-8 py-3 rounded-2xl font-medium hover:from-blue-600 hover:to-purple-700 transform hover:scale-105 transition-all shadow-lg">
                Save Entry ✨
              </button>
            </div>
          </div>

          <!-- Mood Chart -->
          <div class="glass-card rounded-3xl p-6 sm:p-8">
            <h2 class="text-2xl font-semibold mb-6">📈 Mood Trends (Last 7 Days)</h2>
            <div class="h-64">
              <canvas id="moodChart"></canvas>
            </div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="space-y-8">
          <!-- Recent Entries -->
          <div class="glass-card rounded-3xl p-6">
            <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
              📚 Recent Entries
              <span class="text-sm font-normal text-gray-500" id="entriesCount">(0)</span>
            </h2>
            <div id="recentEntries" class="space-y-3 max-h-96 overflow-y-auto"></div>
          </div>

          <!-- Insights -->
          <div class="glass-card rounded-3xl p-6">
            <h2 class="text-xl font-semibold mb-4">💡 Insights</h2>
            <div id="insights" class="space-y-3 text-sm"></div>
          </div>

          <!-- Achievements -->
          <div class="glass-card rounded-3xl p-6">
            <h2 class="text-xl font-semibold mb-4">🏆 Achievements</h2>
            <div id="achievements" class="space-y-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedMood = '';
    let selectedTags = [];
    let moodEntries = JSON.parse(localStorage.getItem('moodEntries') || '[]');
    let moodChart = null;
    
    const moodEmojis = { terrible: '😰', bad: '😔', okay: '😐', good: '😊', excellent: '😍' };
    const moodValues = { terrible: 1, bad: 2, okay: 3, good: 4, excellent: 5 };
    const moodColors = {
      terrible: 'rgb(255, 107, 107)',
      bad: 'rgb(255, 165, 2)',
      okay: 'rgb(241, 196, 15)',
      good: 'rgb(85, 163, 255)',
      excellent: 'rgb(0, 210, 211)'
    };

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      if (moodChart) {
        updateChart();
      }
    }

    function selectMood(mood, button) {
      selectedMood = mood;
      document.querySelectorAll('.mood-button').forEach(b => {
        b.classList.remove('ring-4', 'ring-white', 'ring-opacity-50', 'scale-110');
      });
      button.classList.add('ring-4', 'ring-white', 'ring-opacity-50', 'scale-110');
    }

    function toggleTag(button, tag) {
      if (selectedTags.includes(tag)) {
        selectedTags = selectedTags.filter(t => t !== tag);
        button.classList.remove('border-blue-500', 'bg-blue-100', 'dark:bg-blue-900');
        button.classList.add('border-gray-300', 'dark:border-gray-600');
      } else {
        selectedTags.push(tag);
        button.classList.add('border-blue-500', 'bg-blue-100', 'dark:bg-blue-900');
        button.classList.remove('border-gray-300', 'dark:border-gray-600');
      }
    }

    function clearForm() {
      selectedMood = '';
      selectedTags = [];
      document.getElementById('moodNote').value = '';
      document.querySelectorAll('.mood-button').forEach(b => {
        b.classList.remove('ring-4', 'ring-white', 'ring-opacity-50', 'scale-110');
      });
      document.querySelectorAll('.activity-tag').forEach(t => {
        t.classList.remove('border-blue-500', 'bg-blue-100', 'dark:bg-blue-900');
        t.classList.add('border-gray-300', 'dark:border-gray-600');
      });
      updateCharCount();
    }

    function updateCharCount() {
      const text = document.getElementById('moodNote').value;
      document.getElementById('charCount').textContent = `${text.length}/500`;
    }

    function showNotification(message, type = 'success') {
      const notification = document.createElement('div');
      notification.className = `notification p-4 rounded-xl text-white font-medium ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} shadow-lg`;
      notification.textContent = message;
      document.getElementById('notifications').appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    function saveMoodEntry() {
      const note = document.getElementById('moodNote').value.trim();
      if (!selectedMood) {
        showNotification('Please select a mood first!', 'error');
        return;
      }

      const entry = {
        mood: selectedMood,
        note,
        tags: [...selectedTags],
        timestamp: Date.now(),
        date: new Date().toDateString()
      };

      moodEntries.unshift(entry);
      localStorage.setItem('moodEntries', JSON.stringify(moodEntries));
      
      updateAll();
      clearForm();
      showNotification('Mood entry saved successfully! 🎉');
    }

    function updateEntries() {
      const container = document.getElementById('recentEntries');
      const count = document.getElementById('entriesCount');
      
      container.innerHTML = '';
      count.textContent = `(${moodEntries.length})`;
      
      if (moodEntries.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-8">No entries yet. Start tracking your mood!</p>';
        return;
      }

      moodEntries.slice(0, 10).forEach((entry, index) => {
        const el = document.createElement('div');
        el.className = 'entry-card p-4 rounded-2xl bg-gradient-to-r from-white/50 to-white/30 dark:from-gray-700/50 dark:to-gray-600/30 border border-white/20 dark:border-gray-600/20';
        
        const timeAgo = getTimeAgo(entry.timestamp);
        const tags = entry.tags ? entry.tags.map(tag => `<span class="inline-block px-2 py-1 text-xs bg-blue-100 dark:bg-blue-900 rounded-full">${tag}</span>`).join(' ') : '';
        
        el.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="text-2xl">${moodEmojis[entry.mood]}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="font-medium capitalize">${entry.mood}</span>
                <span class="text-xs text-gray-500">${timeAgo}</span>
              </div>
              ${entry.note ? `<p class="text-sm text-gray-600 dark:text-gray-300 mb-2">${entry.note}</p>` : ''}
              ${tags ? `<div class="flex flex-wrap gap-1">${tags}</div>` : ''}
            </div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function updateStats() {
      document.getElementById('totalEntries').textContent = moodEntries.length;
      
      // Calculate streak
      const today = new Date().toDateString();
      const datesWithEntries = [...new Set(moodEntries.map(e => e.date || new Date(e.timestamp).toDateString()))];
      let streak = 0;
      let currentDate = new Date();
      
      while (datesWithEntries.includes(currentDate.toDateString())) {
        streak++;
        currentDate.setDate(currentDate.getDate() - 1);
      }
      
      document.getElementById('entryStreak').textContent = streak;
      
      // Calculate average mood
      if (moodEntries.length > 0) {
        const avgValue = moodEntries.reduce((sum, entry) => sum + moodValues[entry.mood], 0) / moodEntries.length;
        document.getElementById('avgMood').textContent = avgValue.toFixed(1);
      } else {
        document.getElementById('avgMood').textContent = 'N/A';
      }
    }

    function updateInsights() {
      const container = document.getElementById('insights');
      const insights = generateInsights();
      
      container.innerHTML = insights.map(insight => 
        `<div class="p-3 bg-gradient-to-r from-blue-50 to-purple-50 dark:from-blue-900/20 dark:to-purple-900/20 rounded-xl">
          <div class="font-medium text-sm">${insight.title}</div>
          <div class="text-xs text-gray-600 dark:text-gray-300 mt-1">${insight.description}</div>
        </div>`
      ).join('');
    }

    function generateInsights() {
      if (moodEntries.length < 3) return [{ title: "Keep tracking!", description: "Log more entries to see personalized insights." }];
      
      const insights = [];
      const recent = moodEntries.slice(0, 7);
      const moodCounts = recent.reduce((acc, entry) => {
        acc[entry.mood] = (acc[entry.mood] || 0) + 1;
        return acc;
      }, {});
      
      const topMood = Object.entries(moodCounts).sort((a, b) => b[1] - a[1])[0];
      if (topMood) {
        insights.push({
          title: `Most frequent mood: ${topMood[0]}`,
          description: `You've felt ${topMood[0]} ${topMood[1]} times this week.`
        });
      }
      
      // Activity insights
      const allTags = moodEntries.flatMap(e => e.tags || []);
      const tagCounts = allTags.reduce((acc, tag) => {
        acc[tag] = (acc[tag] || 0) + 1;
        return acc;
      }, {});
      
      const topTag = Object.entries(tagCounts).sort((a, b) => b[1] - a[1])[0];
      if (topTag) {
        insights.push({
          title: `Top activity: ${topTag[0]}`,
          description: `This has influenced your mood ${topTag[1]} times.`
        });
      }
      
      return insights;
    }

    function updateAchievements() {
      const container = document.getElementById('achievements');
      const achievements = [];
      
      if (moodEntries.length >= 1) achievements.push({ icon: '🎯', name: 'First Entry', desc: 'Started your mood journey' });
      if (moodEntries.length >= 7) achievements.push({ icon: '📅', name: 'Week Warrior', desc: 'Tracked for 7 entries' });
      if (moodEntries.length >= 30) achievements.push({ icon: '🗓️', name: 'Monthly Master', desc: 'Tracked for 30 entries' });
      
      const streak = parseInt(document.getElementById('entryStreak').textContent);
      if (streak >= 3) achievements.push({ icon: '🔥', name: 'On Fire', desc: `${streak} day streak!` });
      if (streak >= 7) achievements.push({ icon: '⭐', name: 'Consistency Star', desc: `${streak} day streak!` });
      
      container.innerHTML = achievements.map(achievement => 
        `<div class="flex items-center gap-3 p-3 bg-gradient-to-r from-yellow-50 to-orange-50 dark:from-yellow-900/20 dark:to-orange-900/20 rounded-xl">
          <span class="text-2xl">${achievement.icon}</span>
          <div>
            <div class="font-medium text-sm">${achievement.name}</div>
            <div class="text-xs text-gray-600 dark:text-gray-300">${achievement.desc}</div>
          </div>
        </div>`
      ).join('');
    }

    function updateChart() {
      const canvas = document.getElementById('moodChart');
      const ctx = canvas.getContext('2d');
      
      if (moodChart) {
        moodChart.destroy();
      }
      
      const last7Days = [];
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(today.getDate() - i);
        last7Days.push(date.toDateString());
      }
      
      const chartData = last7Days.map(date => {
        const dayEntries = moodEntries.filter(entry => {
          const entryDate = entry.date || new Date(entry.timestamp).toDateString();
          return entryDate === date;
        });
        
        if (dayEntries.length === 0) return null;
        
        const avgMood = dayEntries.reduce((sum, entry) => sum + moodValues[entry.mood], 0) / dayEntries.length;
        return avgMood;
      });
      
      const isDark = document.documentElement.classList.contains('dark');
      
      moodChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: last7Days.map(date => new Date(date).toLocaleDateString('en', { weekday: 'short' })),
          datasets: [{
            label: 'Average Mood',
            data: chartData,
            borderColor: 'rgb(99, 102, 241)',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointRadius: 6,
            pointHoverRadius: 8,
            pointBackgroundColor: 'rgb(99, 102, 241)',
            pointBorderColor: '#fff',
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: false,
              min: 1,
              max: 5,
              ticks: {
                stepSize: 1,
                callback: function(value) {
                  const moodLabels = { 1: 'Terrible', 2: 'Bad', 3: 'Okay', 4: 'Good', 5: 'Excellent' };
                  return moodLabels[value];
                },
                color: isDark ? '#9CA3AF' : '#6B7280'
              },
              grid: {
                color: isDark ? 'rgba(156, 163, 175, 0.2)' : 'rgba(107, 114, 128, 0.2)'
              }
            },
            x: {
              ticks: {
                color: isDark ? '#9CA3AF' : '#6B7280'
              },
              grid: {
                color: isDark ? 'rgba(156, 163, 175, 0.2)' : 'rgba(107, 114, 128, 0.2)'
              }
            }
          }
        }
      });
    }

    function exportData() {
      const dataStr = JSON.stringify(moodEntries, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(dataBlob);
      link.download = `mood-tracker-data-${new Date().toISOString().split('T')[0]}.json`;
      link.click();
      
      showNotification('Data exported successfully! 📊');
    }

    function getTimeAgo(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      
      if (days > 0) return `${days}d ago`;
      if (hours > 0) return `${hours}h ago`;
      if (minutes > 0) return `${minutes}m ago`;
      return 'Just now';
    }

      updateInsights();
      updateAchievements();
      updateChart();
    }

    // Add swipe gestures for mobile
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    });

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    });

    function handleSwipe() {
      const swipeThreshold = 50;
      const diff = touchStartX - touchEndX;
      
      if (Math.abs(diff) > swipeThreshold) {
        if (diff > 0) {
          // Swiped left - could add navigation here

    function checkForReminders() {
      const lastEntry = moodEntries[0];
      if (!lastEntry) return;

      const timeSinceLastEntry = Date.now() - lastEntry.timestamp;
      
      if (timeSinceLastEntry > sixHours) {

    // Check for reminders every hour
    setInterval(checkForReminders, 60 * 60 * 1000);

    // Add smooth scrolling to form when mood is selected
    function selectMood(mood, button) {
      selectedMood = mood;
      document.querySelectorAll('.mood-button').forEach(b => {
        b.classList.remove('ring-4', 'ring-white', 'ring-opacity-50', 'scale-110');
